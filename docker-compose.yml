version: "3.8"

services:
  # Python FastAPI AI Microservice
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: skill_centric_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./ai:/app

  # Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill_centric_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/skill_centric}
      - JWT_SECRET=${JWT_SECRET:-skill_centric_secret_2026}
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - ai-service
    volumes:
      - ./backend:/app
      - /app/node_modules

  # React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skill_centric_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
